[project]
name = "sentinel"
version = "0.1.0"
description = "Lightweight AI snapshot detector for Home Assistant"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "pyyaml",
    "uvicorn",
]

[project.scripts]
sentinel = "sentinel.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]
