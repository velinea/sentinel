homeassistant:
  url: http://<HOMEASSISTANT_IP>:8123
  token: YOUR_LONG_TOKEN

inference:
  url: http://<SENTINEL-INFERENCE_IP>:8000
  min_confidence: 0.7

polling:
  idle_interval: 5
  active_interval: 3
  error_interval: 15

activity:
  movement_threshold: 30

storage:
  path: "/PATH/TO/snapshots"
  save_detections: true
  # retention_days: 30
  # max_snapshots_per_camera: 500

logging:
  level: INFO

# Optional: base URL of the Sentinel HTTP server, used to build
# the image_url in sentinel_detection events
# notification:
#   image_base_url: http://sentinel:8001

# Optional: go2rtc snapshot source
# go2rtc:
#   url: http://localhost:1984
#   stream_url: https://go2rtc.yourdomain.com

# Optional: web dashboard auth
# Recommended when using Tailscale Funnel or any public exposure.
# token: a secret required on every URL (?token=...) or auto-set as a
# session cookie after the first authorized visit.
# auth_user/auth_password: optional Basic HTTP auth alternative.
# web:
#   token: YOUR_SECRET_TOKEN
#   auth_user: sentinel
#   auth_password: CHANGE_ME
#   # Restrict the /live grid to specific cameras (default: all with a main stream)
#   live_cameras: [front_door, front_yard, garage, driveway]

# Optional: video clip recording (requires ffmpeg)
# clips:
#   enabled: true
#   buffer_seconds: 10
#   max_seconds: 60
#   save_path: "/PATH/TO/clips"
#   crf: 23
#   fps: 10
#   # Skip detection polling while a clip is being recorded (default true)
#   skip_detection_during_recording: true
#   # stretch 4:3 sub streams to 16:9 in saved clips.
#   # Default false: clips keep the camera's native aspect.
#   stretch_4_3_to_16_9: false

# Optional: NVR (XiongMai CGI) recordings timeline on /recordings.
# Requires each NVR camera to also set nvr_channel below.
# nvr:
#   host: 192.168.1.250
#   user: admin
#   password: CHANGE_ME
#   http_port: 80

cameras:
  - name: front_door
    entity: camera.terassi_sannce_1
    objects:
      - person
      - cat

  - name: front_yard
    entity: camera.piha_sannce_2
    objects:
      - person
      - car

  - name: garage
    entity: camera.piha_sannce_3
    objects:
      - person
      - car
      - truck

  - name: driveway
    entity: camera.piha_sannce_4
    objects:
      - person
      - car
      - truck

  - name: garden
    entity: camera.reolink_fluent
    objects:
      - person
      - dog
      - cat

# Example: go2rtc camera source
# cameras:
#   - name: front_door
#     entity: camera.terassi_sannce_1
#     source: go2rtc
#     go2rtc_src: cam0_sub
#     objects:
#       - person
#       - cat

# Example: detect sub-stream, save main stream
# cameras:
#   - name: front_door
#     entity: camera.terassi_sannce_1
#     source: go2rtc
#     go2rtc_src: cam0_sub
#     go2rtc_save_src: cam0_main
#     notify: true
#     notify_title: "Front Door"
#     objects:
#       - person
#       - cat

# Example: per-camera aspect override
# The global clips.stretch_4_3_to_16_9 applies unless a camera overrides
# it. Set false to keep this camera's clips native (e.g. a camera whose
# sensor itself is 4:3 and only its main stream was switched to 16:9).
# cameras:
#   - name: reolink
#     entity: camera.reolink_fluent
#     source: go2rtc
#     go2rtc_url: http://127.0.0.1:1985       # internal API URL
#     go2rtc_stream_url: https://reolink.example.com  # public live link URL
#     go2rtc_src: reolink_sub
#     go2rtc_save_src: reolink_main
#     stretch_4_3_to_16_9: false
#     objects:
#       - person

# Example: NVR channel mapping for the /recordings timeline
# cameras:
#   - name: driveway
#     entity: camera.piha_sannce_4
#     source: go2rtc
#     go2rtc_src: cam0_sub
#     go2rtc_save_src: cam0_main
#     nvr_channel: 1   # 1-indexed NVR physical channel; omit to exclude from timeline
#     objects:
#       - person
