homeassistant:
  url: http://<HOMEASSISTANT_IP>:8123
  token: YOUR_LONG_TOKEN

inference:
  url: http://<SENTINEL-INFERENCE_IP>:8000
  min_confidence: 0.7

polling:
  idle_interval: 5
  active_interval: 3
  error_interval: 15

activity:
  movement_threshold: 30

storage:
  path: "/PATH/TO/snapshots"
  save_detections: true
  # retention_days: 30
  # max_snapshots_per_camera: 500

logging:
  level: INFO

# Optional: base URL of the Sentinel HTTP server, used to build
# the image_url in sentinel_detection events
# notification:
#   image_base_url: http://sentinel:8001

# Optional: go2rtc snapshot source
# go2rtc:
#   url: http://localhost:1984

# Optional: video clip recording (requires ffmpeg)
# clips:
#   enabled: true
#   buffer_seconds: 10
#   post_seconds: 5
#   max_seconds: 60
#   save_path: "/PATH/TO/clips"
#   crf: 23
#   fps: 10

cameras:
  - name: front_door
    entity: camera.terassi_sannce_1
    objects:
      - person
      - cat

  - name: front_yard
    entity: camera.piha_sannce_2
    objects:
      - person
      - car

  - name: garage
    entity: camera.piha_sannce_3
    objects:
      - person
      - car
      - truck

  - name: driveway
    entity: camera.piha_sannce_4
    objects:
      - person
      - car
      - truck

  - name: garden
    entity: camera.reolink_fluent
    objects:
      - person
      - dog
      - cat

# Example: go2rtc camera source
# cameras:
#   - name: front_door
#     entity: camera.terassi_sannce_1
#     source: go2rtc
#     go2rtc_src: cam0_sub
#     objects:
#       - person
#       - cat

